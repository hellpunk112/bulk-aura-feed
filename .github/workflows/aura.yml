name: Refresh Aura leaderboard

on:
  schedule:
    # BULK distributes Aura on Saturdays ~13:00 UTC (6:45pm Nepal); second run is a retry.
    - cron: '30 13 * * 6'
    - cron: '0 15 * * 6'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fetch.mjs', '.github/workflows/aura.yml']

permissions:
  contents: write

concurrency:
  group: aura
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright-core@1.47.2
      - run: node fetch.mjs
      - name: Commit if changed
        run: |
          git config user.name "aura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura-leaderboard.json
          git diff --cached --quiet && exit 0
          git commit -m "Aura leaderboard $(date -u +%F)"
          git push
